<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Escaparate Musical</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cuenta.css">
</head>
<body class="pagina-cuenta">

    <div class="marca-cuenta">
        <a href="index.html">Escaparate Musical</a>
    </div>

    <main class="tarjeta-cuenta">
        <h1>Ingresar</h1>
        <p class="subtitulo-cuenta">Accede para administrar el perfil de tu banda o tu local.</p>

        <p class="aviso-cuenta">
            Las cuentas todavía no están activas. Por ahora, para actualizar tu ficha
            escríbenos desde <a href="contactos.html" style="color:var(--rojo-brillo)">Contactos</a>.
        </p>

        <form id="formulario-ingreso" novalidate>
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" class="filtro-texto" autocomplete="email">
            </div>

            <div class="campo">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" class="filtro-texto" autocomplete="current-password">
            </div>

            <button type="submit" class="boton boton-crema boton-ancho">Ingresar</button>
            <p class="mensaje-cuenta" id="mensaje" hidden></p>
        </form>

        <p class="pie-cuenta">
            ¿Todavía no tienes cuenta? <a href="registrarse.html">Regístrate</a>
        </p>
    </main>

    <script src="js/comunes.js"></script>
    <script src="js/cuenta.js"></script>
</body>
</html>
